[package]
name = "piedit"
version = "0.2.0"
edition = "2024"
description = "Native edit pipeline for the pi agent — parity-tested against the built-in edit tool"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"
