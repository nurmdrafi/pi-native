[package]
name = "pibash"
version = "0.1.0"
edition = "2024"
description = "Native shell-output pipeline for the pi agent — parity-tested against the built-in bash tool"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
tempfile = "3"
