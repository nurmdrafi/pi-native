# Native Rust tool crates. A workspace gives one build/test entry point, a
# single shared rust-tools/Cargo.lock, and one rust-tools/target/ (not three).
#
# Build everything:      cargo build --release            (from rust-tools/)
# Build one tool:        cargo build --release -p piedit
# Test everything:       cargo test                       (from rust-tools/)
# Lint everything:       cargo clippy --all-targets -- -D warnings
#
# scripts/bootstrap.sh and scripts/after-pull.sh build with -p <name> so a
# change to one crate does not rebuild the other two.
[workspace]
resolver = "2"
members = ["pidx", "piread", "piedit", "pibash", "piwrite", "docheck", "outline"]

# Shared dependency versions hoisted here so the five pipeline crates (pidx,
# piread, piedit, pibash, piwrite) cannot drift apart. Members inherit with
# `workspace = true`; crate-specific extra features (e.g. pidx's
# serde_json float_roundtrip) are declared additively in the member manifest.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# Shared release profile (profiles must live at the workspace root; per-crate
# copies are ignored). Unified on the piread/piedit settings; pidx now also
# aborts on panic, which is fine for a short-lived CLI.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
