<text x="16" y="470" font-size="9" fill="#8b949e" text-anchor="start">bars exactly proportional to values within each row · each row scaled to its own max - compare lengths within a row, read values across rows</text>
<text x="16" y="484" font-size="9" fill="#8b949e" text-anchor="start">why some wins look small: pibash runs a Tier-1 compression pre-pass and a parity-pinned envelope - context-shaping work the built-in never does</text>
<text x="16" y="498" font-size="9" fill="#8b949e" text-anchor="start">pidx cold-index writes full extracts + a state store, so it trails its oracle · warm rerun pays back at ~17x · piwrite serve-mode trails in-bench (100 MB one-shot is the fast path)</text>
<text x="16" y="512" font-size="9" fill="#8b949e" text-anchor="start">p50 per op · tool-call-boundary microbenchmarks (not agent-level task runs) · regenerate: npm run bench:piread / bench:pibash / bench:piedit / bench:piwrite · src: docs/native-tools.md</text>
