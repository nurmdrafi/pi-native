name: Release CI/CD

on:
  push:
    branches: ['main']

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare Build Info
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_notes: ${{ steps.release-notes.outputs.notes }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Extract version from changelog
        id: version
        run: |
          # Validate CHANGELOG.md exists and is readable
          if [ ! -f "CHANGELOG.md" ]; then
            echo "ERROR: CHANGELOG.md file not found"
            exit 1
          fi

          if [ ! -r "CHANGELOG.md" ]; then
            echo "ERROR: CHANGELOG.md file is not readable"
            exit 1
          fi

          # Extract version from CHANGELOG.md
          CHANGELOG_LINE=$(grep '^## \[' CHANGELOG.md | head -1)
          if [ -z "$CHANGELOG_LINE" ]; then
            echo "ERROR: No version entry found in CHANGELOG.md"
            echo "CHANGELOG.md first few lines:"
            head -5 CHANGELOG.md
            exit 1
          fi

          VERSION=$(echo "$CHANGELOG_LINE" | cut -d'[' -f2 | cut -d']' -f1 | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')

          # Release-readiness gates: a non-version top heading or an
          # already-released version means "nothing to release" — exit green
          # and let the release job's `if` skip.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::notice::CHANGELOG top heading is '$VERSION' (not x.y.z) — skipping release"
            echo "CHANGELOG line: $CHANGELOG_LINE"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Immutable-tag guard: ask the remote, not the local clone
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
            echo "::notice::tag v$VERSION already exists — release for this version is done, skipping"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_release=true" >> "$GITHUB_OUTPUT"

          echo "Successfully extracted version from CHANGELOG.md: $VERSION"
          echo "CHANGELOG line: $CHANGELOG_LINE"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG
        id: release-notes
        run: |
          VERSION=${{ steps.version.outputs.version }}
          NOTES=$(awk "/^## \\[${VERSION//./\\.}\\]/{flag=1; next} /^## \\[/{if(flag) exit} flag" CHANGELOG.md | sed '1d')
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  release:
    name: Create GitHub Release
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          body: |
            ## What's Changed
            ${{ needs.prepare.outputs.release_notes }}
          draft: false
          prerelease: false
          generate_release_notes: false
