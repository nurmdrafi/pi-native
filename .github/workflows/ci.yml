name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - run: npm ci
      - name: Build and install native tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ripgrep
          cargo build --release --manifest-path rust-tools/Cargo.toml
          mkdir -p bin "$HOME/.pi/agent/bin"
          for b in docheck pibash piread piwrite piedit pidx outline; do
            cp "rust-tools/target/release/$b" "bin/$b"
            cp "rust-tools/target/release/$b" "$HOME/.pi/agent/bin/$b"
          done
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint:agents

  test-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - run: cargo test --manifest-path rust-tools/Cargo.toml
