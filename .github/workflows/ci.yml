name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]

jobs:
  test-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Build and install native tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ripgrep
          cargo build --release --manifest-path rust-tools/Cargo.toml
          mkdir -p bin "$HOME/.pi/agent/bin"
          for b in docheck pibash piread piwrite piedit pidx outline; do
            cp "rust-tools/target/release/$b" "bin/$b"
            cp "rust-tools/target/release/$b" "$HOME/.pi/agent/bin/$b"
          done
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint:agents

  test-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path rust-tools/Cargo.toml
